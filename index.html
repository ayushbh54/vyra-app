<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VYRA — Unified 3D Digital Twin & Enterprise Admin Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050811;
      --bg-bar: rgba(7, 11, 20, 0.92);
      --border-cyan: rgba(0, 210, 255, 0.28);
      --border-active: #00D2FF;
      --cyan: #00D2FF;
      --cyan-glow: rgba(0, 210, 255, 0.45);
      --emerald: #34FF8C;
      --emerald-glow: rgba(52, 255, 140, 0.3);
      --text: #DFE2F0;
      --text-muted: #8896AB;
      --bar-height: 58px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Top Universal Eco-Switcher Bar */
    #eco-bar {
      height: var(--bar-height);
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-cyan);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: relative;
      z-index: 1000;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(52, 255, 140, 0.2));
      border: 1px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      color: var(--cyan);
      box-shadow: 0 0 14px var(--cyan-glow);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFF;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-tag {
      font-size: 9px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--emerald);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Central Segmented Mode Switcher */
    .switcher-container {
      display: flex;
      align-items: center;
      background: rgba(14, 20, 34, 0.9);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: #FFF;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(0, 160, 255, 0.45));
      color: #FFF;
      border: 1px solid var(--border-active);
      box-shadow: 0 0 16px var(--cyan-glow);
    }

    .mode-btn.admin-mode.active {
      background: linear-gradient(135deg, rgba(165, 94, 234, 0.3), rgba(113, 88, 226, 0.5));
      border-color: #A55EEA;
      box-shadow: 0 0 16px rgba(165, 94, 234, 0.4);
    }

    .mode-btn .badge-pill {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Right Status & Actions */
    .right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
      justify-content: flex-end;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--emerald);
      background: rgba(52, 255, 140, 0.08);
      border: 1px solid rgba(52, 255, 140, 0.25);
      padding: 4px 10px;
      border-radius: 14px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      animation: pulse-dot 1.8s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .quick-action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .quick-action-btn:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: var(--cyan);
      color: #FFF;
    }

    /* Frame Viewport Area */
    #viewport-container {
      width: 100vw;
      height: calc(100vh - var(--bar-height));
      height: calc(100dvh - var(--bar-height));
      position: relative;
      background: var(--bg-dark);
    }

    .app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: var(--bg-dark);
    }

    .app-frame.active {
      display: block;
    }

    /* Toast Notification */
    #eco-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(13, 20, 36, 0.95);
      border: 1px solid var(--border-active);
      color: #FFF;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px var(--cyan-glow);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #eco-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive Mobile Adjustments */
    @media (max-width: 768px) {
      :root {
        --bar-height: 52px;
      }
      #eco-bar {
        padding: 0 10px;
      }
      .brand-title {
        font-size: 13px;
      }
      .brand-tag, .right-actions .live-status, .quick-action-btn span {
        display: none;
      }
      .brand-section, .right-actions {
        min-width: auto;
      }
      .mode-btn {
        padding: 6px 11px;
        font-size: 12px;
        gap: 5px;
      }
      .mode-btn .badge-pill {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- TOP DUAL ECOSYSTEM SWITCHER -->
  <header id="eco-bar">
    <div class="brand-section">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <div class="brand-title">VYRA <span style="color: var(--cyan); font-weight: 300;">|</span> 3D</div>
        <div class="brand-tag">Ecosystem</div>
      </div>
    </div>

    <!-- SWITCHER PILLS -->
    <nav class="switcher-container" role="tablist">
      <button id="btn-user" class="mode-btn active" role="tab" aria-selected="true" onclick="setMode('user')">
        <span>👤 Athlete 3D Studio</span>
        <span class="badge-pill">USER</span>
      </button>
      <button id="btn-admin" class="mode-btn admin-mode" role="tab" aria-selected="false" onclick="setMode('admin')">
        <span>🛡️ Enterprise Command</span>
        <span class="badge-pill">ADMIN</span>
      </button>
    </nav>

    <!-- RIGHT STATUS & SHUTTLES -->
    <div class="right-actions">
      <div class="live-status" title="Ecosystem connected & interactive">
        <span class="live-dot"></span>
        <span>ONLINE</span>
      </div>
      <button class="quick-action-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        ⛶ <span>Fullscreen</span>
      </button>
      <button class="quick-action-btn" onclick="sharePortalLink()" title="Copy Link to Open on Any Device">
        🔗 <span>Share</span>
      </button>
    </div>
  </header>

  <!-- VIEWPORT CONTAINER -->
  <main id="viewport-container">
    <!-- USER 3D ATHLETE & BIOMECHANICS PORTAL -->
    <iframe
      id="frame-user"
      class="app-frame active"
      src="portal.html"
      title="VYRA Athlete 3D Digital Twin and Biomechanics Studio"
      allow="camera; microphone; accelerometer; gyroscope; fullscreen; display-capture"
    ></iframe>

    <!-- ENTERPRISE ADMIN COMMAND CENTER -->
    <iframe
      id="frame-admin"
      class="app-frame"
      src="admin.html"
      title="VYRA Enterprise Admin Console"
      allow="camera; microphone; accelerometer; gyroscope; fullscreen"
    ></iframe>
  </main>

  <!-- GLOBAL TOAST NOTIFIER -->
  <div id="eco-toast">
    <span id="eco-toast-icon">⚡</span>
    <span id="eco-toast-msg">Mode switched</span>
  </div>

  <script>
    let currentMode = 'user';

    function setMode(mode, updateHistory = true) {
      if (mode === currentMode) return;
      currentMode = mode;

      const btnUser = document.getElementById('btn-user');
      const btnAdmin = document.getElementById('btn-admin');
      const frameUser = document.getElementById('frame-user');
      const frameAdmin = document.getElementById('frame-admin');

      if (mode === 'user') {
        btnUser.classList.add('active');
        btnUser.setAttribute('aria-selected', 'true');
        btnAdmin.classList.remove('active');
        btnAdmin.setAttribute('aria-selected', 'false');

        frameUser.classList.add('active');
        frameAdmin.classList.remove('active');

        document.title = 'VYRA — Athlete 3D Digital Twin & Biomechanical Studio';
        showToast('👤 Switched to Athlete 3D Studio & Biomechanics', '⚡');
      } else {
        btnAdmin.classList.add('active');
        btnAdmin.setAttribute('aria-selected', 'true');
        btnUser.classList.remove('active');
        btnUser.setAttribute('aria-selected', 'false');

        frameAdmin.classList.add('active');
        frameUser.classList.remove('active');

        document.title = 'VYRA — Enterprise Operations Center | Admin Console';
        showToast('🛡️ Switched to Enterprise Admin Command Center', '🛡️');
      }

      if (updateHistory) {
        const newHash = mode === 'admin' ? '#admin' : '#user';
        window.history.replaceState(null, '', newHash);
      }
    }

    // Keyboard Shortcuts: Alt+1 for User, Alt+2 for Admin
    window.addEventListener('keydown', (e) => {
      if (e.altKey && e.key === '1') {
        setMode('user');
      } else if (e.altKey && e.key === '2') {
        setMode('admin');
      }
    });

    // Toast Popup
    function showToast(message, icon = '⚡') {
      const toast = document.getElementById('eco-toast');
      const msgEl = document.getElementById('eco-toast-msg');
      const iconEl = document.getElementById('eco-toast-icon');

      iconEl.innerText = icon;
      msgEl.innerText = message;
      toast.classList.add('show');

      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2800);
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        showToast('Entered Fullscreen Mode');
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        showToast('Exited Fullscreen Mode');
      }
    }

    // Share Portal Link
    async function sharePortalLink() {
      const url = window.location.href;
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'VYRA 3D Fitness Ecosystem',
            text: 'Check out the VYRA 3D Athlete & Admin Ecosystem!',
            url: url
          });
          return;
        } catch (e) {}
      }

      navigator.clipboard.writeText(url).then(() => {
        showToast('🔗 Portal link copied! Open on any mobile or desktop.', '📋');
      }).catch(() => {
        showToast('Open URL in any browser: ' + url, '🌐');
      });
    }

    // Initialize Mode from URL (hash or query param)
    function initMode() {
      const params = new URLSearchParams(window.location.search);
      const modeParam = params.get('mode') || params.get('view');
      const hash = window.location.hash.toLowerCase();

      if (modeParam === 'admin' || hash === '#admin') {
        setMode('admin', false);
      } else {
        setMode('user', false);
      }
    }

    // Listen to hash change from back/forward buttons
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.toLowerCase();
      if (hash === '#admin') setMode('admin', false);
      else if (hash === '#user') setMode('user', false);
    });

    initMode();
  </script>
</body>
</html>

name: Build VYRA Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Environment
        run: |
          flutter --version
          flutter doctor

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build Release APK (Connected to Render Backend)
        run: |
          cd apps/mobile
          flutter build apk --release --split-per-abi \
            --dart-define=VYRA_API_URL=https://vyra-api.onrender.com

      - name: Build Universal Release APK
        run: |
          cd apps/mobile
          flutter build apk --release \
            --dart-define=VYRA_API_URL=https://vyra-api.onrender.com

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyra-release-apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

name: Build VYRA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Verify Flutter & Android Environment
        run: |
          flutter --version
          flutter doctor

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          chmod +x android/gradlew
          flutter pub get

      - name: Patch Legacy Android Plugins for AGP 8 (Missing Namespace)
        shell: bash
        run: |
          python3 -c "
          import glob, os
          pattern = os.path.expanduser('~/.pub-cache/hosted/pub.dev/**/android/build.gradle')
          count = 0
          for f in glob.glob(pattern, recursive=True):
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      content = fp.read()
                  if 'android {' in content and 'namespace' not in content:
                      pkg = 'flutter.plugins.contactsservice.contactsservice' if 'contacts_service' in f else 'com.vyra.plugin.' + os.path.basename(os.path.dirname(os.path.dirname(f))).split('-')[0].replace('.', '_')
                      patched = content.replace('android {', f'android {{\\n    namespace \"{pkg}\"')
                      with open(f, 'w', encoding='utf-8') as fp:
                          fp.write(patched)
                      print(f'✓ Successfully injected namespace \"{pkg}\" into: {f}')
                      count += 1
              except Exception as e:
                  print(f'Warning patching {f}: {e}')
          print(f'Total plugins patched: {count}')
          "

      - name: Analyze Flutter Code
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos || true

      - name: Build Release APK (Connected to Render Backend)
        shell: bash
        run: |
          set -o pipefail
          cd apps/mobile
          flutter build apk --release -v \
            --dart-define=VYRA_API_URL=https://vyra-app.onrender.com \
            --android-skip-build-dependency-validation 2>&1 | tee /tmp/flutter_build.log

      - name: Show Build Log Tail on Failure
        if: failure()
        run: |
          echo "==================== BUILD FAILED ===================="
          if [ -f /tmp/flutter_build.log ]; then
            grep -i -C 3 "error •" /tmp/flutter_build.log || true
            echo "==================== LAST 200 LINES ===================="
            tail -n 200 /tmp/flutter_build.log || true
          else
            echo "No /tmp/flutter_build.log found — failure occurred before or during analysis step."
          fi

      - name: Publish Failure Log to Branch
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-build-logs
          {
            echo "=== BUILD FAILURE DIAGNOSTIC ==="
            if [ -f /tmp/flutter_build.log ]; then
              echo "=== FLUTTER BUILD ERRORS ==="
              grep -i -C 3 "error •" /tmp/flutter_build.log || true
              echo ""
              echo "=== BUILD LOG TAIL ==="
              tail -n 400 /tmp/flutter_build.log || true
            else
              echo "Build failed before flutter build apk step was reached."
            fi
          } > build_error_summary.txt
          git add build_error_summary.txt
          git commit -m "chore: save CI failure log [skip ci]" || true
          git push -f origin ci-build-logs || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyra-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 2

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: "VYRA Android App (Build #${{ github.run_number }})"
          draft: false
          prerelease: false
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          body: |
            ### 🚀 VYRA AI Athletic Ecosystem - Android Release
            
            **Direct Download:**
            👉 [Download app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-build-${{ github.run_number }}/app-release.apk)
            
            **What's New in this Build:**
            - ⌚ **HiWatch Pro Smartwatch Support**: Reverse-engineered GATT BLE protocol (`6e40ff01`), Blood Pressure (BP), SpO2, and continuous step streaming.
            - 🏃 **Real Human Muscular Avatar**: Anatomical athletic curves, compression shorts, and running sneakers.
            - 🤖 **Floating AI Voice Coach**: All-time floating robot at bottom-right with Web Speech voice recognition and spoken responses.
            - 📷 **Pose Tracking Fix**: Removed blind auto-timer, added exercise carousel & 1-tap rep recorder.
            - 🩸 **e-RaktKosh Map Fix**: Switched to OpenStreetMap tiles (no API key needed).
            - 🌐 **Full Web & Mobile Parity**: Hydration tracker, AI Food Scanner, Beacon SOS, Leaderboard Podium.

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: /tmp/flutter_build.log
          retention-days: 2

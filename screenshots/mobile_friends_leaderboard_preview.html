<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090E;
      --card-bg: rgba(18, 24, 38, 0.9);
      --cyan: #00D2FF;
      --green: #34FF8C;
      --orange: #FFAF81;
      --red: #FF4757;
      --amber: #FFB800;
      --purple: #B288FF;
      --text: #DFE2F0;
      --text-muted: #8896AB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070B;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .device-wrapper {
      width: 412px;
      height: 870px;
      background: #000;
      border-radius: 50px;
      padding: 10px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.1), 0 0 40px rgba(0,210,255,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .device-screen {
      flex: 1;
      background: #090D16;
      border-radius: 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }
    .device-screen::-webkit-scrollbar { display: none; }
    .status-bar {
      height: 38px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #FFF;
      z-index: 10;
    }
    .nav-header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .nav-title { font-size: 17px; font-weight: 800; color: #FFF; }
  </style>

<title>VYRA Friends & Family Leaderboard</title>
</head>
<body>
  <div class="device-wrapper">
    <div class="device-screen">
      <div class="status-bar"><span>09:41</span><span>5G 📶 100%</span></div>
      <div class="nav-header">
        <span class="nav-title">Friends & Family Cup</span>
        <span style="font-size:18px;">🔗</span>
      </div>

      <div style="padding:14px 20px;">
        
        <!-- Podium Top 3 -->
        <div style="display:flex; justify-content:center; align-items:flex-end; gap:12px; margin:16px 0 24px;">
          <!-- 2nd -->
          <div style="display:flex; flex-direction:column; align-items:center; width:95px;">
            <div style="font-size:16px;">🥈</div>
            <div style="width:48px; height:48px; border-radius:50%; background:#2A354A; border:2px solid #C0C0C0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; margin:4px 0;">PS</div>
            <div style="font-size:12px; font-weight:700; color:#FFF;">Pooja Didi</div>
            <div style="font-size:10px; color:var(--text-muted);">16,420 pts</div>
            <div style="width:100%; height:75px; background:linear-gradient(180deg, #2A364E 0%, #151C2B 100%); border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; color:#C0C0C0; margin-top:8px;">2</div>
          </div>

          <!-- 1st -->
          <div style="display:flex; flex-direction:column; align-items:center; width:105px;">
            <div style="font-size:20px;">👑</div>
            <div style="width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg, #00D2FF, #34FF8C); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; color:#000; box-shadow:0 0 20px rgba(0,210,255,0.4); margin:4px 0;">AB</div>
            <div style="font-size:13px; font-weight:900; color:#FFF;">Ayush (You)</div>
            <div style="font-size:11px; color:var(--cyan); font-weight:700;">21,850 pts</div>
            <div style="width:100%; height:105px; background:linear-gradient(180deg, #00D2FF 0%, #0B2545 100%); border-radius:14px 14px 0 0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:32px; color:#000; margin-top:8px;">1</div>
          </div>

          <!-- 3rd -->
          <div style="display:flex; flex-direction:column; align-items:center; width:95px;">
            <div style="font-size:16px;">🥉</div>
            <div style="width:48px; height:48px; border-radius:50%; background:#2A354A; border:2px solid #CD7F32; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; margin:4px 0;">RK</div>
            <div style="font-size:12px; font-weight:700; color:#FFF;">Ramesh Ji</div>
            <div style="font-size:10px; color:var(--text-muted);">14,110 pts</div>
            <div style="width:100%; height:55px; background:linear-gradient(180deg, #2A364E 0%, #151C2B 100%); border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:20px; color:#CD7F32; margin-top:8px;">3</div>
          </div>
        </div>

        <!-- WhatsApp Invite & Contact Sync Card -->
        <div style="background:rgba(0,210,255,0.08); border:1px solid rgba(0,210,255,0.25); border-radius:16px; padding:14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div>
            <div style="font-size:13px; font-weight:800; color:#FFF;">Invite Friends & Family</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">vyra://join?ref=ayush • 14 On VYRA</div>
          </div>
          <button style="background:var(--cyan); border:none; border-radius:10px; padding:8px 14px; font-size:12px; font-weight:800; color:#000;">WhatsApp</button>
        </div>

        <!-- Leaderboard List -->
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.03); border-radius:14px; padding:12px 14px;">
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="font-weight:900; font-size:14px; width:18px; color:var(--text-muted);">#4</span>
              <div style="width:36px; height:36px; border-radius:50%; background:#1E2738; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;">SM</div>
              <div>
                <div style="font-size:13px; font-weight:700; color:#FFF;">Sanjay Mama</div>
                <div style="font-size:10.5px; color:var(--text-muted);">7-Day Streak 🔥</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:14px; font-weight:800; color:#FFF;">11,240</div>
              <div style="font-size:10px; color:var(--green);">+340 today</div>
            </div>
          </div>

          <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.03); border-radius:14px; padding:12px 14px;">
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="font-weight:900; font-size:14px; width:18px; color:var(--text-muted);">#5</span>
              <div style="width:36px; height:36px; border-radius:50%; background:#1E2738; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;">VM</div>
              <div>
                <div style="font-size:13px; font-weight:700; color:#FFF;">Vikram Malhotra</div>
                <div style="font-size:10.5px; color:var(--text-muted);">Gym Warrior Tier</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:14px; font-weight:800; color:#FFF;">9,890</div>
              <div style="font-size:10px; color:var(--green);">+510 today</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
